# Деплой статического сайта на GitHub Pages (корень репозитория = сайт).
# Секрет OPENROUTER_API_KEY (необязательно) → при сборке создаётся js/config.local.js для AI-чата.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]  # автодеплой при push в main
  workflow_dispatch:  # ручной запуск в Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true  # отменить предыдущий деплой, если новый push

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4  # скачать код репозитория

      # Если в Secrets задан OPENROUTER_API_KEY — записать js/config.local.js для продакшена
      - name: Подключить ключ AI на сайте (если задан секрет)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then
            printf '%s\n' "window.DHARMA_OPENROUTER_KEY = '$OPENROUTER_API_KEY';" > js/config.local.js
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .  # весь проект как статический сайт

      - id: deployment
        uses: actions/deploy-pages@v4
